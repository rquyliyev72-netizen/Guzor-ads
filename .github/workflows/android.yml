name: Android build

on:
  push:
    branches: ["**"]
    paths-ignore: ["dist/**", "store/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.YOLCHI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build test APK
        run: ./gradlew --no-daemon assembleDebug

      # Signed Play Store bundle, built only when the signing secrets are configured.
      - name: Build signed release bundle
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          YOLCHI_KEYSTORE_PASSWORD: ${{ secrets.YOLCHI_KEYSTORE_PASSWORD }}
          YOLCHI_KEY_ALIAS: ${{ secrets.YOLCHI_KEY_ALIAS }}
          YOLCHI_KEY_PASSWORD: ${{ secrets.YOLCHI_KEY_PASSWORD }}
          YOLCHI_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "${{ secrets.YOLCHI_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          YOLCHI_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease assembleRelease
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: yolchi-android
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Save APK to the branch (dist/)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/yolchi-test.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then cp app/build/outputs/bundle/release/app-release.aab dist/yolchi-release.aab; fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk dist/yolchi-release.apk; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "Build outputs for ${GITHUB_SHA::7} [skip ci]"
          git push
